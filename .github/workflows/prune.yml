name: prune-notion
# Manual "clean up" button for the weekly database (the original database is
# never touched). Run it from the repo's Actions tab ("Run workflow"), or with:
#   gh workflow run prune-notion -f days=30
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Archive weekly-digest rows last fetched more than this many days ago"
        required: true
        type: number
        default: 30
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests python-dateutil
      - name: Load tracking state (it remembers the weekly database)
        run: |
          mkdir -p .state
          if git fetch --quiet --depth=1 origin state; then git show FETCH_HEAD:state.json > .state/state.json; fi
      - run: python -m fetcher.prune --days "$DAYS"
        env:
          DAYS: ${{ inputs.days }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}   # only to refuse touching it
          NOTION_WEEKLY_DB_ID: ${{ secrets.NOTION_WEEKLY_DB_ID }}
