name: daily-fetch
on:
  schedule:
    - cron: "15 22 * * *"    # 22:15 UTC == 05:15 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch: {}       # allow manual runs
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r fetcher/requirements.txt
      # Chromium for the voz ranked-listing fetch (solves its Cloudflare JS
      # challenge). If voz is blocked from the Actions IP, the fetcher falls
      # back to voz RSS automatically — the run still succeeds.
      - run: python -m playwright install --with-deps chromium
      - run: python -m fetcher.main
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          # (Cleanup is manual — see the prune-notion workflow, not auto here.)

# (registered via push)
