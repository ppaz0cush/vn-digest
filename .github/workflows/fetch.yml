name: daily-fetch
on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC == 07:00 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch: {}       # allow manual runs
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r fetcher/requirements.txt
      # Chromium for the voz ranked-listing fetch (solves its Cloudflare JS
      # challenge). If voz is blocked from the Actions IP, the fetcher falls
      # back to voz RSS automatically — the run still succeeds.
      - run: python -m playwright install --with-deps chromium
      - run: python -m fetcher.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
