# Vietnamese Tech Digest — source configuration.
#
# THIS FILE is the "add/delete forums" mechanism. To add a voz sub-forum or
# another feed, edit this file and commit. The fetcher reads it on every run.
#
# Recency windows follow the rule:
#   - high-volume + ranked sources use a SHORT window (~previous day) so you get
#     TODAY's most-discussed, not week-old posts (engagement counts accumulate
#     over time, so a long window surfaces stale items).
#   - low-volume "get all" sources use a LONG window (7-14 days) so the section
#     is not empty on days they didn't post.
# Adjust window_hours / max_items per source freely.

sources:
  - name: voz
    # Set the sub-forum(s) you want. Find the slug.id by opening the sub-forum on
    # voz.vn and copying it from the URL, e.g. voz.vn/f/<slug>.<id>/
    # Default below targets the "Điểm báo" (press/news) section. The generic
    # site-wide feed is a noisy firehose — target tech/IT/news sections.
    # voz fronts its HTML listing with a Cloudflare JS "managed challenge" that
    # plain HTTP (requests/curl) cannot solve. We drive a headless browser
    # (Playwright/Chromium) which executes the challenge JS, then rank the
    # recently-active threads by views/replies client-side -> real 'Top by
    # views'. If Playwright is missing or the challenge isn't solved, the fetcher
    # falls back to the per-forum RSS (chronological) and relabels voz 'Latest'.
    # Enable ranked voz:  pip install playwright && python -m playwright install chromium
    use_browser: true       # set false to use RSS only (no browser dependency)
    skip_sticky: true       # ignore pinned megathreads (they'd top views forever)
    # trending: rank by views GAINED since the previous run (~24h on the daily
    # cron) instead of lifetime totals, so a long-running thread bumped today
    # doesn't outrank genuinely hot ones. New threads rank by their current
    # count (their views are all recent). Set false to rank by lifetime totals.
    trending: true
    # Forums to pull from. Format: '<slug>.<id>' for normal /f/ forums, or
    # '<type>/<slug>.<id>' for other node types (voz's /s/ nodes). Find a
    # slug.id by opening the forum on voz.vn and copying it from the URL.
    forums:
      - "diem-bao.33"               # Điểm báo (news)
      - "phan-mem.13"               # Phần mềm
      - "app-di-dong.21"            # App di động
      - "chuyen-tro-linh-tinh.17"   # Chuyện trò linh tinh™ (very high traffic)
      - "from-f17-with-love.69"     # from f17 with love
      - "s/review-san-pham.103"     # Review sản phẩm  (/s/ node)
      - "s/chia-se-kien-thuc.104"   # Chia sẻ kiến thức (/s/ node)
    rank: top
    rank_by: views          # 'views' is harder to game than 'replies' (bumping)
    per_forum_items: 4      # keep top-4 PER forum so no single forum dominates
    window_hours: 24        # rank among threads ACTIVE in the last 24h
    max_items: 28           # overall voz cap (7 forums × 4)
    label: "Top"

  # (dailydev removed — its unauthenticated feed was a frozen all-time-popular
  # snapshot with stale dates, not a live daily feed.)

  - name: tinhte
    url: "https://tinhte.vn/rss"
    rank: top
    rank_by: comments       # comment count is in the RSS via <slash:comments>
    trending: true          # rank by comments GAINED since last run (still-hot)
    tiebreak: published_desc
    window_hours: 24
    max_items: 5
    label: "Top"

  - name: vnexpress
    url: "https://vnexpress.net/rss/so-hoa.rss"
    rank: top
    rank_by: comments       # via the comment-count API (RSS has no counts)
    trending: true          # rank by comments GAINED since last run (still-hot)
    tiebreak: published_desc
    window_hours: 24
    max_items: 5
    label: "Top"

  - name: anonyviet
    url: "https://anonyviet.com/feed/"
    rank: latest
    window_hours: 168       # 7 days (low volume)
    max_items: 20
    label: "Latest"

  - name: spiderum
    # CONFIRMED scope: the "Quan điểm - Tranh luận" category only.
    category_url: "https://spiderum.com/danh-muc/quan-diem-tranh-luan?sort=new&page_idx=1"
    post_url_pattern: "https://spiderum.com/bai-dang/{slug}"
    rank: latest
    # NOTE: spiderum's listing exposes no post timestamps, so window_hours has no
    # effect here (dateless items are always kept) — max_items + page order rule.
    window_hours: 24
    max_items: 5
    label: "Latest"

  - name: engineerpro
    url: "https://engineerprovn.substack.com/feed"
    rank: latest
    window_hours: 336       # 14 days — they post only ~2-3x/week
    max_items: 20
    label: "Latest"
