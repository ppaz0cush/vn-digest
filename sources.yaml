# VN Digest — source configuration (weekly digest).
#
# THIS FILE is the "add/remove sources" mechanism; the fetcher reads it on
# every run. Two kinds of source:
#
#   mode: weekly_top  tracked all week; the first run after the `publish:` time
#                     writes the top N (`top:`) to Notion.
#   mode: all         every new post is written to Notion as soon as a run
#                     sees it. A post is written once; pruning it doesn't
#                     bring it back.
#
# Runs happen 4x a day (.github/workflows/fetch.yml). Everything is written to
# the "VN Digest Weekly" Notion database; the original database is never touched.

publish:
  weekday: monday          # the first run after this weekday + hour publishes
  hour: 3                  # 03:00 local time
  timezone: Asia/Ho_Chi_Minh

sources:
  - name: voz
    mode: weekly_top
    # Ranked by views GAINED this week. Each run reads every forum's own list
    # "updated in the last 7 days, sorted by views" in a headless browser (voz
    # sits behind Cloudflare) and records the counts.
    top: 20                # top 20 across all forums below
    # Forum format: '<slug>.<id>' for normal /f/ forums, or '<type>/<slug>.<id>'
    # for other node types (voz's /s/ nodes). Copy it from the forum's URL.
    forums:
      - "diem-bao.33"               # Điểm báo (news)
      - "chuyen-tro-linh-tinh.17"   # Chuyện trò linh tinh™ (very high traffic)
      - "from-f17-with-love.69"     # from f17 with love (love, marriage, family)
    max_pages: 8           # per forum per run; reading stops once totals drop
                           # below the current 20th-best gain
    skip_sticky: true      # ignore pinned threads
    max_views: 999999      # voz shows 1M+ as "1M", "3M": their weekly gain
                           # can't be measured, so those threads are skipped

  - name: tinhte
    mode: weekly_top
    url: "https://tinhte.vn/rss"   # ~1 day of articles, with comment counts
    top: 2                 # most-commented articles published this week
    refresh_top: 10        # re-check this many candidates' counts at publish

  - name: vnexpress
    mode: weekly_top
    # "Số hóa" was merged into "Khoa học công nghệ" (the old so-hoa.rss URL
    # redirects here). Comment counts come from vnexpress's comment API.
    url: "https://vnexpress.net/rss/khoa-hoc-cong-nghe.rss"
    top: 2                 # most-commented articles published this week

  - name: anonyviet
    mode: all
    url: "https://anonyviet.com/feed/"
    lookback_days: 14      # only posts from the last 14 days

  - name: engineerpro
    mode: all
    # Every post ever: Substack's archive API lists the whole history. Substack
    # blocks GitHub's servers, so it's fetched directly, else via a headless
    # browser, else via Jina Reader (r.jina.ai); the RSS feed (latest 20) is
    # the last resort.
    archive_url: "https://engineerprovn.substack.com/api/v1/archive"
    url: "https://engineerprovn.substack.com/feed"
    lookback_days: null    # no limit
